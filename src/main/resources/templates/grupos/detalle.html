<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${grupo.nombre} + ' - GymRoutine'">
        Detalle del grupo muscular - GymRoutine
    </title>

    <link rel="stylesheet" th:href="@{/css/detalle.css}">
</head>

<body>

<div class="container">

    <header class="header">

        <a th:href="@{/grupos}"
           class="header__back"
           aria-label="Volver al listado de grupos musculares">

            <svg class="header__back-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 aria-hidden="true">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>

            Volver al listado
        </a>

    </header>

    <main class="main">

        <article class="detail">

            <div class="detail__image-container">

                <img th:if="${grupo.imagenUrl != null and !#strings.isEmpty(grupo.imagenUrl)}"
                     th:src="${grupo.imagenUrl}"
                     th:alt="'Imagen de ' + ${grupo.nombre}"
                     class="detail__image">

                <div th:unless="${grupo.imagenUrl != null and !#strings.isEmpty(grupo.imagenUrl)}"
                     class="detail__placeholder">

                    <svg class="detail__placeholder-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         aria-hidden="true">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>

                    <span>Imagen no disponible</span>

                </div>

            </div>

            <div class="detail__content">

                <div class="detail__header">

                    <h1 class="detail__title"
                        th:text="${grupo.nombre}">
                        Nombre del grupo muscular
                    </h1>

                </div>

                <section class="detail__section">

                    <h2 class="detail__section-title">
                        Descripción
                    </h2>

                    <p class="detail__text"
                       th:text="${grupo.descripcion}">
                        Descripción del grupo muscular
                    </p>

                </section>

                <div class="detail__actions">

                    <a th:href="@{/grupos/{id}/editar(id=${grupo.id})}"
                       class="detail__button">
                        Editar grupo
                    </a>

                    <form th:action="@{/grupos/{id}/eliminar(id=${grupo.id})}"
                          method="post"
                          class="detail__delete-form"
                          onsubmit="return confirm('¿Seguro que quieres eliminar este grupo muscular?');">

                        <button type="submit"
                                class="detail__button detail__button--danger">
                            Eliminar grupo
                        </button>

                    </form>

                </div>

            </div>

        </article>

    </main>

</div>

</body>

</html>
