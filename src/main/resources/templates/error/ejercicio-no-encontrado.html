<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicio no encontrado - GymRoutine</title>

    <link rel="stylesheet" th:href="@{/css/nuevo-ejercicio.css}">
</head>

<body>

<div class="container">

    <main class="main">

        <section class="form-card">

            <header class="header">

                <h1 class="header__title">
                    Ejercicio no encontrado
                </h1>

                <p class="header__subtitle">
                    No hemos podido encontrar el ejercicio solicitado.
                </p>

            </header>

            <div class="form__group">

                <p class="form__error"
                   th:text="${mensajeError}">
                    No existe un ejercicio con ese ID.
                </p>

            </div>

            <div class="form__actions">

                <a th:href="@{/ejercicios}"
                   class="button button--primary">
                    Volver a ejercicios
                </a>

            </div>

        </section>

    </main>

</div>

</body>

</html>
