<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${ejercicio.nombre} + ' - GymRoutine'">
        Detalle del ejercicio - GymRoutine
    </title>

    <link rel="stylesheet" th:href="@{/css/detalle.css}">
</head>

<body>

<div class="container">

    <header class="header">
        <a th:href="@{/ejercicios}"
           class="header__back"
           aria-label="Volver al listado de ejercicios">

            <svg class="header__back-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 aria-hidden="true">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>

            Volver al listado
        </a>
    </header>

    <main class="main">

        <article class="detail">

            <div class="detail__image-container">

                <img th:if="${ejercicio.imagenUrl != null and !#strings.isEmpty(ejercicio.imagenUrl)}"
                     th:src="${ejercicio.imagenUrl}"
                     th:alt="'Imagen de ' + ${ejercicio.nombre}"
                     class="detail__image">

                <div th:unless="${ejercicio.imagenUrl != null and !#strings.isEmpty(ejercicio.imagenUrl)}"
                     class="detail__placeholder">

                    <svg class="detail__placeholder-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         aria-hidden="true">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>

                    <span>Imagen no disponible</span>
                </div>

            </div>

            <div class="detail__content">

                <div class="detail__header">

                    <h1 class="detail__title"
                        th:text="${ejercicio.nombre}">
                        Nombre del ejercicio
                    </h1>

                    <span class="detail__muscle"
                          th:text="${ejercicio.musculoPrincipal.nombre}">
                        Grupo muscular
                    </span>

                </div>

                <div class="detail__material"
                     th:if="${ejercicio.material != null and !#strings.isEmpty(ejercicio.material)}">

                    <svg class="detail__material-icon"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         aria-hidden="true">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>

                    <span th:text="${ejercicio.material}">
                        Material necesario
                    </span>

                </div>

                <section class="detail__section">

                    <h2 class="detail__section-title">
                        Descripción
                    </h2>

                    <p class="detail__text"
                       th:text="${ejercicio.descripcion}">
                        Descripción del ejercicio
                    </p>

                </section>

                <section class="detail__section">

                    <h2 class="detail__section-title">
                        Ejecución
                    </h2>

                    <p class="detail__text"
                       th:text="${ejercicio.ejecucion}">
                        Cómo ejecutar correctamente el ejercicio
                    </p>

                </section>

                <section class="detail__section"
                         th:if="${ejercicio.erroresFrecuentes != null and !#strings.isEmpty(ejercicio.erroresFrecuentes)}">

                    <h2 class="detail__section-title">
                        Errores frecuentes
                    </h2>

                    <p class="detail__text"
                       th:text="${ejercicio.erroresFrecuentes}">
                        Errores comunes a evitar
                    </p>

                </section>

                <div class="detail__actions"
                     th:if="${ejercicio.videoUrl != null and !#strings.isEmpty(ejercicio.videoUrl)}">

                    <a th:href="${ejercicio.videoUrl}"
                       class="detail__button"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Ver vídeo del ejercicio">

                        <svg class="detail__button-icon"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             aria-hidden="true">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  stroke-width="2"
                                  d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>

                        Ver vídeo
                    </a>

                </div>

            </div>

        </article>

    </main>

</div>

</body>
</html>
